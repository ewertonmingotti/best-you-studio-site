# Redirect /experiencia to root (the landing page IS the experience)
[[redirects]]
  from = "/experiencia"
  to = "/"
  status = 200

[[redirects]]
  from = "/best-you"
  to = "/"
  status = 200


# Force HTTPS
[[redirects]]
  from = "http://bestyoustudio.com.br/*"
  to = "https://bestyoustudio.com.br/:splat"
  status = 301
  force = true

# Custom headers for performance and security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# HTML pages: never cache, always fetch latest version
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

